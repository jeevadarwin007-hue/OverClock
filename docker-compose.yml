version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: campusops-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-campusops}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-campusops}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusops-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-campusops}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-campusops}
      SECRET_KEY: ${SECRET_KEY:-campusops_super_secret_jwt_key_2026_production}
      CAMPUSOPS_ADMIN_PASSWORD: ${CAMPUSOPS_ADMIN_PASSWORD:-}
      CAMPUSOPS_STUDENT_PASSWORD: ${CAMPUSOPS_STUDENT_PASSWORD:-}
      CAMPUSOPS_OTHER_DEMO_PASSWORD: ${CAMPUSOPS_OTHER_DEMO_PASSWORD:-}
      CAMPUSOPS_ALLOW_ANY_PASSWORD: ${CAMPUSOPS_ALLOW_ANY_PASSWORD:-false}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}
      GROQ_API_URL: ${GROQ_API_URL:-https://api.groq.com/openai/v1/chat/completions}
      CAMPUS_NAME: "SRM Easwari Engineering College"
      CAMPUS_LAT: 13.0324
      CAMPUS_LON: 80.1810
    volumes:
      - ./backend:/app
      - ./scripts:/app/scripts

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campusops-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://backend:8000
      VITE_CAMPUS_NAME: "SRM Easwari Engineering College"
      VITE_CAMPUS_LAT: 13.0324
      VITE_CAMPUS_LON: 80.1810
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
    driver: local

